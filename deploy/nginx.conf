# MikoPoker nginx config snippet
# Add this as a server block or include it in your existing nginx config.
# After adding, run: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name poker.yourdomain.com;  # ← change to your domain

    location / {
        proxy_pass http://127.0.0.1:9555;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets aggressively (hashed filenames = safe to cache forever)
    location /assets/ {
        proxy_pass http://127.0.0.1:9555;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
