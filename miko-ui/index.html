<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MikoPoker - Texas Hold'em</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #music-toggle {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border: 2px solid #5588aa;
      border-radius: 8px;
      background: rgba(51, 68, 85, 0.85);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.15s;
    }
    #music-toggle:hover {
      background: rgba(68, 85, 102, 0.9);
    }
  </style>
</head>
<body>
  <div id="game-canvas"></div>
  <button id="music-toggle" title="Toggle music">&#x1F507;</button>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
