<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MikoPoker - Texas Hold'em</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .top-btn {
      position: fixed;
      top: 12px;
      z-index: 100;
      width: 44px;
      height: 44px;
      border: 2px solid #5588aa;
      border-radius: 8px;
      background: rgba(51, 68, 85, 0.85);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background 0.15s;
    }
    .top-btn:hover {
      background: rgba(68, 85, 102, 0.9);
    }
    #sound-toggle { right: 12px; }
    #settings-toggle { right: 64px; }

    /* Settings modal */
    #settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
    }
    #settings-modal.open {
      display: flex;
    }
    #settings-panel {
      background: #1e2a3a;
      border: 2px solid #5588aa;
      border-radius: 12px;
      padding: 24px 32px;
      min-width: 280px;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    #settings-panel h2 {
      margin: 0 0 16px;
      font-size: 20px;
      text-align: center;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 12px 0;
      border-bottom: 1px solid #2a3a4a;
    }
    .setting-row:last-child {
      border-bottom: none;
    }
    .setting-label {
      font-size: 16px;
    }
    .setting-options {
      display: flex;
      gap: 8px;
    }
    .setting-options button {
      padding: 6px 14px;
      border: 2px solid #5588aa;
      border-radius: 6px;
      background: transparent;
      color: #aac;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .setting-options button.active {
      background: #5588aa;
      color: #fff;
    }
    .setting-options button:hover:not(.active) {
      background: rgba(85, 136, 170, 0.3);
    }
    #settings-close {
      display: block;
      margin: 18px auto 0;
      padding: 8px 32px;
      border: 2px solid #5588aa;
      border-radius: 8px;
      background: rgba(51, 68, 85, 0.85);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #settings-close:hover {
      background: rgba(68, 85, 102, 0.9);
    }
    /* About modal */
    #about-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
    }
    #about-modal.open {
      display: flex;
    }
    #about-panel {
      background: #1a1a2e;
      border: 2px solid #5588aa;
      border-radius: 12px;
      padding: 36px 48px;
      min-width: 300px;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #about-panel h2 {
      margin: 0 0 20px;
      font-size: 26px;
      font-weight: bold;
    }
    #about-panel .about-version {
      font-size: 16px;
      color: #aac;
      margin: 0 0 24px;
    }
    #about-panel .about-copyright {
      font-size: 14px;
      color: #888;
      font-style: italic;
      margin: 0 0 28px;
    }
    #about-close {
      display: block;
      margin: 0 auto;
      padding: 8px 40px;
      border: 2px solid #5588aa;
      border-radius: 8px;
      background: rgba(51, 68, 85, 0.85);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.15s;
    }
    #about-close:hover {
      background: rgba(68, 85, 102, 0.9);
    }
    #page-title {
      cursor: pointer;
    }
    /* Game Over modal */
    #gameover-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.7);
    }
    #gameover-modal.open {
      display: flex;
    }
    #gameover-panel {
      background: #1e2a3a;
      border: 2px solid #5588aa;
      border-radius: 12px;
      padding: 32px 48px;
      min-width: 300px;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    #gameover-panel h2 {
      margin: 0 0 12px;
      font-size: 24px;
    }
    #gameover-message {
      font-size: 16px;
      color: #aac;
      margin-bottom: 24px;
    }
    .gameover-btn {
      padding: 12px 40px;
      border: 2px solid #4ade80;
      border-radius: 8px;
      background: #2a6e3f;
      color: #4ade80;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
      margin: 6px 8px;
    }
    .gameover-btn:hover {
      background: #3a8e5f;
    }
    #quit-btn {
      border-color: #aa5555;
      background: #6e2a2a;
      color: #ff8888;
    }
    #quit-btn:hover {
      background: #8e3a3a;
    }
    .gameover-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }
    #copyright {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      z-index: 100;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 13px;
      font-style: italic;
      color: #888;
      user-select: none;
      display: none;
    }
    #page-title {
      position: fixed;
      top: 14px;
      left: 16px;
      z-index: 100;
      font-family: Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
      user-select: none;
      display: none;
    }
    #mobile-gate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #1a1a2e;
      color: #fff;
      font-family: Arial, sans-serif;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
      gap: 16px;
      padding: 32px;
    }
    #mobile-gate h2 {
      font-size: 28px;
      margin: 0;
    }
    #mobile-gate p {
      font-size: 16px;
      color: #aac;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="mobile-gate">
    <h2>MikoPoker</h2>
    <p>Not yet supported on mobile browsers or small desktop browser windows.</p>
  </div>
  <div id="game-canvas"></div>
  <div id="page-title">MikoPoker</div>
  <div id="copyright">© 2026 MiraNova Studios</div>
  <button id="settings-toggle" class="top-btn" title="Settings">&#x2699;</button>
  <button id="sound-toggle" class="top-btn" title="Toggle sound">&#x1F50A;</button>

  <!-- About modal -->
  <div id="about-modal">
    <div id="about-panel">
      <h2>Miko Poker (Demo)</h2>
      <p class="about-version">Version <span id="about-version-number"></span></p>
      <p class="about-copyright">&copy; 2026 MiraNova Studios</p>
      <button id="about-close">OK</button>
    </div>
  </div>
  <!-- Settings modal -->
  <div id="settings-modal">
    <div id="settings-panel">
      <h2>Settings</h2>
      <div class="setting-row">
        <span class="setting-label">Player Name</span>
        <div class="setting-options">
          <input id="player-name" type="text" maxlength="16" placeholder="Player" spellcheck="false"
            style="background:#1a1a2e; color:#fff; border:1px solid #5588aa; border-radius:4px; padding:4px 8px; font-size:14px; width:140px; outline:none;">
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Card Deck</span>
        <div class="setting-options">
          <button id="deck-png" class="active">PNG</button>
          <button id="deck-unicode">Unicode</button>
        </div>
      </div>
      <div class="setting-row" id="four-color-row">
        <span class="setting-label">4-Color Deck</span>
        <div class="setting-options">
          <button id="fourcolor-on">On</button>
          <button id="fourcolor-off" class="active">Off</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Chip Display</span>
        <div class="setting-options">
          <button id="chip-dollar" class="active">Dollars ($)</button>
          <button id="chip-bb">Big Blinds (BB)</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Card Animations</span>
        <div class="setting-options">
          <button id="anims-on" class="active">On</button>
          <button id="anims-off">Off</button>
        </div>
      </div>
      <div class="setting-row">
        <span class="setting-label">Table</span>
        <div class="setting-options">
          <button id="table-1" class="active">Table 1</button>
          <button id="table-2">Table 2</button>
        </div>
      </div>
      <button id="settings-close">Close</button>
    </div>
  </div>
  <!-- Game Over modal -->
  <div id="gameover-modal">
    <div id="gameover-panel">
      <h2>Game Over</h2>
      <p id="gameover-message">You ran out of chips!</p>
      <div class="gameover-buttons">
        <button id="rebuy-btn" class="gameover-btn" style="display:none;">Rebuy ($1000)</button>
        <button id="quit-btn" class="gameover-btn" style="display:none;">Quit</button>
        <button id="new-game-btn" class="gameover-btn" style="display:none;">New Game</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
