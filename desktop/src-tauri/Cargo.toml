[package]
name = "mikopoker"
version = "0.6.5"
description = "MikoPoker Texas Hold'em"
authors = ["MiraNova Studio"]
edition = "2021"

[lib]
name = "mikopoker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
